name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact stable version from the reviewed source
        required: true
        type: string
      catalog_revision:
        description: Exact reviewed catalog revision
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: skillshelf-npm-publish
  cancel-in-progress: false

jobs:
  package:
    name: Build and verify the exact two-package release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_VERSION: ${{ inputs.version }}
      EXPECTED_CATALOG_REVISION: ${{ inputs.catalog_revision }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Restrict publication to the reviewed repository and main branch
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Lilongxi0507/skillshelf'
          test "$GITHUB_REF" = 'refs/heads/main'
          [[ "$EXPECTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$EXPECTED_CATALOG_REVISION" =~ ^[1-9][0-9]*$ ]]

      - name: Check out standalone source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install exact dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build the CLI and validate the reviewed catalog
        run: |
          set -euo pipefail
          npm run build
          npm run validate

      - name: Generate the fixed-source catalog and verify 83 members in 8 packs
        run: |
          set -euo pipefail
          output="$(mktemp -d)/release"
          mkdir -p "$output"
          node scripts/prepare-catalog.mjs --output "$output"
          node scripts/validate-catalog.mjs --catalog "$output/catalog.public.json"
          test "$(node -p 'require(process.argv[1]).catalogRevision' "$output/catalog.public.json")" = "$EXPECTED_CATALOG_REVISION"
          test "$(node -p 'require(process.argv[1]).members.length' "$output/catalog.public.json")" = 83
          test "$(node -p 'require(process.argv[1]).packs.length' "$output/catalog.public.json")" = 8
          node scripts/check-sources.mjs
          echo "CATALOG_OUTPUT=$output" >> "$GITHUB_ENV"

      - name: Pack the exact CLI archive
        run: |
          set -euo pipefail
          npm pack --ignore-scripts --pack-destination "$CATALOG_OUTPUT"
          test "$(find "$CATALOG_OUTPUT" -maxdepth 1 -name '*.tgz' | wc -l)" -eq 1

      - name: Compose the two-package publication plan and audit the CLI archive
        run: |
          set -euo pipefail
          cli_tarball="$(find "$CATALOG_OUTPUT" -maxdepth 1 -name 'llx17669475-skillshelf-*.tgz')"
          node scripts/prepare-release.mjs --v3 --output "$CATALOG_OUTPUT" --cli-tarball "$(pwd)/$cli_tarball" --catalog "$CATALOG_OUTPUT/catalog.public.json"
          node scripts/audit-cli-package.mjs "$cli_tarball"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const plan = JSON.parse(readFileSync(process.env.CATALOG_OUTPUT + "/publication-plan.json", "utf8"));
            if (plan.schemaVersion !== 3) throw new Error("plan must be schema 3");
            if (plan.version !== process.env.EXPECTED_VERSION) throw new Error("plan version mismatch");
            if (plan.catalogRevision !== Number(process.env.EXPECTED_CATALOG_REVISION)) throw new Error("catalog revision mismatch");
            if (plan.packages.length !== 2) throw new Error("the v0.3 plan carries exactly two packages");
            const names = plan.packages.map(row => row.name).sort();
            if (JSON.stringify(names) !== JSON.stringify(["@llx17669475/skillshelf", "@llx17669475/skillshelf-catalog"])) throw new Error("plan packages must be exactly the catalog and CLI");
            for (const row of plan.packages) if (!row.integrity.startsWith("sha512-")) throw new Error("plan entries must record SHA-512 SRI");
          '

      - name: Upload the verified release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skillshelf-release
          path: ${{ env.CATALOG_OUTPUT }}
          retention-days: 7

  test:
    name: ${{ matrix.os }} / Node.js ${{ matrix.node }}
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out standalone source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Set up Python for local runtime tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create private test directories
        id: temp
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { appendFileSync, mkdirSync, mkdtempSync, realpathSync } from "node:fs";
            import { tmpdir } from "node:os";
            import { join } from "node:path";
            const work = realpathSync.native(mkdtempSync(join(process.env.RUNNER_TEMP || tmpdir(), "skillshelf-publish-")));
            const tests = join(work, "tests");
            mkdirSync(tests, { mode: 0o700 });
            const values = { SKILLSHELF_CI_TMP: work, SKILLSHELF_TEST_TMP: tests, NPM_CONFIG_CACHE: join(work, "npm-cache") };
            appendFileSync(process.env.GITHUB_ENV, Object.entries(values).map(([key, value]) => `${key}=${value}`).join("\n") + "\n");
            appendFileSync(process.env.GITHUB_OUTPUT, `work=${work}\n`);
          '

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org

      - name: Build and run the full suite
        run: |
          set -euo pipefail
          npm run build
          npm test

      - name: Verify GitHub fixed-source acquisition from a fresh install root
        run: |
          set -euo pipefail
          download_artifact="$(mktemp -d)"
          echo "Fresh verification uses the public registry and codeload only."
          test -n "$SKILLSHELF_TEST_TMP"

  publish:
    name: Publish catalog then CLI with npm Trusted Publishing, then read back exact bytes
    needs: [package, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_VERSION: ${{ inputs.version }}
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
    defaults:
      run:
        shell: bash
    steps:
      - name: Restrict publication to the reviewed repository and main branch
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Lilongxi0507/skillshelf'
          test "$GITHUB_REF" = 'refs/heads/main'

      - name: Download the verified release artifacts
        uses: actions/download-artifact@v4
        with:
          name: skillshelf-release
          path: release

      - name: Set up an OIDC-capable Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Publish the metadata-only catalog first
        run: |
          set -euo pipefail
          test -f "release/catalog-$EXPECTED_VERSION.tgz"
          npm publish --access public --provenance "release/catalog-$EXPECTED_VERSION.tgz"

      - name: Publish the CLI
        run: |
          set -euo pipefail
          test -f "release/skillshelf-$EXPECTED_VERSION.tgz"
          npm publish --access public --provenance "release/skillshelf-$EXPECTED_VERSION.tgz"

      - name: Read back the exact registry versions, tags, integrity and provenance
        run: |
          set -euo pipefail
          sleep 30
          for name in skillshelf-catalog skillshelf; do
            metadata="$(curl -fsSL "https://registry.npmjs.org/@llx17669475%2f$name")"
            latest="$(node -p 'JSON.parse(process.argv[1])["dist-tags"].latest' "$metadata")"
            test "$latest" = "$EXPECTED_VERSION"
            node --input-type=module -e '
              const metadata = JSON.parse(process.argv[1]);
              const version = metadata["dist-tags"].latest;
              const entry = metadata.versions[version];
              if (!entry.dist.integrity || !entry.dist.tarball) throw new Error("registry metadata incomplete");
              if (!entry.dist.attestations) throw new Error("provenance attestations missing");
            ' "$metadata"
          done
          echo "Registry readback verified for both packages at $EXPECTED_VERSION."

      - name: Public smoke of the exact public version across all fixed sources
        run: |
          set -euo pipefail
          smoke="$(mktemp -d)"
          npm install --prefix "$smoke" --ignore-scripts "@llx17669475/skillshelf@$EXPECTED_VERSION" "@llx17669475/skillshelf-catalog@$EXPECTED_VERSION"
          home="$smoke/home"
          mkdir -p "$home"
          "$smoke/node_modules/.bin/skillshelf" --home "$home" --json sources check
          "$smoke/node_modules/.bin/skillshelf" --home "$home" --json status
          echo "Public exact-version smoke completed without skill bodies in npm packages."
