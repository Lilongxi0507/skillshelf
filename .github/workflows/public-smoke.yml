name: Public npm smoke

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Exact published version to verify from the public registry
        required: true
        default: 0.3.0
      catalog_revision:
        description: Exact published catalog revision
        required: true
        default: '1'

permissions:
  contents: read

jobs:
  public-install:
    name: ${{ matrix.os }} / Node.js ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    env:
      EXPECTED_VERSION: ${{ inputs.expected_version }}
      EXPECTED_CATALOG_REVISION: ${{ inputs.catalog_revision }}
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install the exact public CLI and catalog from the registry
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          npm install --prefix "$root" --ignore-scripts "@llx17669475/skillshelf@$EXPECTED_VERSION" "@llx17669475/skillshelf-catalog@$EXPECTED_VERSION"
          echo "SMOKE_ROOT=$root" >> "$GITHUB_ENV"

      - name: Verify the public metadata-only catalog carries 83 members in 8 packs
        run: |
          set -euo pipefail
          catalog="$(node -e 'console.log(require.resolve("@llx17669475/skillshelf-catalog/package.json", {paths:[process.env.SMOKE_ROOT+"/node_modules"]}))' | xargs dirname)/catalog.json"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const catalog = JSON.parse(readFileSync(process.argv[1], "utf8"));
            if (catalog.schemaVersion !== 3) throw new Error("public catalog must be schema 3");
            if (catalog.catalogRevision !== Number(process.env.EXPECTED_CATALOG_REVISION)) throw new Error("catalog revision mismatch");
            if (catalog.members.length !== 83) throw new Error("catalog must list 83 members");
            if (catalog.packs.length !== 8) throw new Error("catalog must list 8 packs");
            for (const member of catalog.members) {
              if (member.sourceManifest.acquisition.kind !== "github") throw new Error("all members must be fixed GitHub acquisitions");
            }
          ' "$catalog"

      - name: Acquire every pack from its pinned GitHub source and verify
        run: |
          set -euo pipefail
          home="$SMOKE_ROOT/home"
          mkdir -p "$home"
          cli="$SMOKE_ROOT/node_modules/.bin/skillshelf"
          for pack in taste ui-ux-pro-max skillshelf-web-search skillshelf-media-generation archify matt-pocock superpowers gitnexus; do
            "$cli" --home "$home" --json install --collection "$pack" --yes
          done
          "$cli" --home "$home" --json verify
          "$cli" --home "$home" --json status

      - name: Exercise history, source checks, rollback and the offline bundle
        run: |
          set -euo pipefail
          home="$SMOKE_ROOT/home"
          cli="$SMOKE_ROOT/node_modules/.bin/skillshelf"
          "$cli" --home "$home" --json sources check
          "$cli" --home "$home" --json history gitnexus-cli
          "$cli" --home "$home" --json check
          bundle="$SMOKE_ROOT/bundle"
          "$cli" --home "$home" --json export --output "$bundle" --bundle --yes
          "$cli" --home "$home" --offline --json status
          echo "Exact public smoke completed for $EXPECTED_VERSION."
