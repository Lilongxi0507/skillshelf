name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skillshelf-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Produce the single reviewed release bundle / Linux Node.js 22
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out standalone source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create private package output
        id: temp
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { appendFileSync, mkdtempSync, realpathSync } from "node:fs";
            import { tmpdir } from "node:os";
            import { join } from "node:path";
            const work = realpathSync(mkdtempSync(join(tmpdir(), "skillshelf-ci-")));
            appendFileSync(process.env.GITHUB_ENV, `SKILLSHELF_CI_TMP=${work}\nSKILLSHELF_TEST_CATALOG=${join(work, "packages", "catalog.development.json")}\nNPM_CONFIG_CACHE=${join(work, "npm-cache")}\n`);
            appendFileSync(process.env.GITHUB_OUTPUT, `work=${work}\n`);
          '

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org

      - name: Build CLI and validate committed source metadata
        run: |
          set -euo pipefail
          npm run build
          npm run validate

      - name: Pack and verify complete skill and catalog archives
        run: |
          set -euo pipefail
          node scripts/pack-skills.mjs --output "$SKILLSHELF_CI_TMP/packages" --write-bootstrap
          node scripts/copy-catalog.mjs
          npm run validate
          node scripts/validate-catalog.mjs --catalog "$SKILLSHELF_TEST_CATALOG" --development

      - name: Pack the actual CLI and verify all 18 release archives
        run: |
          set -euo pipefail
          npm pack --workspace packages/cli --ignore-scripts --pack-destination "$SKILLSHELF_CI_TMP/packages"
          artifact="$(node --input-type=module -e 'import {readFileSync} from "node:fs"; const p=JSON.parse(readFileSync("packages/cli/package.json","utf8")); process.stdout.write(p.name.replace(/^@/,"").replace("/","-")+"-"+p.version+".tgz");')"
          node scripts/audit-cli-package.mjs "$SKILLSHELF_CI_TMP/packages/$artifact"
          node scripts/prepare-release.mjs --output "$SKILLSHELF_CI_TMP/packages" --cli-tarball "$SKILLSHELF_CI_TMP/packages/$artifact"

      - name: Share this exact bundle with every platform job
        uses: actions/upload-artifact@v4
        with:
          name: skillshelf-reviewed-bundle
          path: ${{ steps.temp.outputs.work }}/packages/
          if-no-files-found: error
          retention-days: 7

  test:
    name: ${{ matrix.os }} / Node.js ${{ matrix.node }}
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out standalone source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Set up Python for local runtime tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create private temporary test directories
        id: temp
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { appendFileSync, mkdirSync, mkdtempSync, realpathSync } from "node:fs";
            import { tmpdir } from "node:os";
            import { join } from "node:path";
            const work = realpathSync(mkdtempSync(join(tmpdir(), "skillshelf-ci-")));
            const tests = join(work, "tests");
            mkdirSync(tests, { mode: 0o700 });
            const python = join(process.env.pythonLocation, process.platform === "win32" ? "python.exe" : "bin/python3");
            const values = {
              SKILLSHELF_CI_TMP: work,
              SKILLSHELF_TEST_TMP: tests,
              SKILLSHELF_TEST_CATALOG: join(work, "packages", "catalog.development.json"),
              SKILLSHELF_PYTHON: python,
              NPM_CONFIG_CACHE: join(work, "npm-cache")
            };
            appendFileSync(process.env.GITHUB_ENV, Object.entries(values).map(([key, value]) => `${key}=${value}`).join("\n") + "\n");
            appendFileSync(process.env.GITHUB_OUTPUT, `work=${work}\n`);
          '

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org

      - name: Build CLI and validate source metadata
        run: |
          set -euo pipefail
          npm run build
          npm run validate

      - name: Download the same reviewed archives on this platform
        uses: actions/download-artifact@v4
        with:
          name: skillshelf-reviewed-bundle
          path: ${{ steps.temp.outputs.work }}/packages

      - name: Recheck downloaded archives against source and publication plan
        run: |
          set -euo pipefail
          artifact="$(node --input-type=module -e 'import {readFileSync} from "node:fs"; const p=JSON.parse(readFileSync("packages/cli/package.json","utf8")); process.stdout.write(p.name.replace(/^@/,"").replace("/","-")+"-"+p.version+".tgz");')"
          node scripts/validate-catalog.mjs --catalog "$SKILLSHELF_TEST_CATALOG" --development
          node scripts/audit-cli-package.mjs "$SKILLSHELF_CI_TMP/packages/$artifact"
          node scripts/prepare-release.mjs --output "$SKILLSHELF_CI_TMP/packages" --cli-tarball "$SKILLSHELF_CI_TMP/packages/$artifact"
          printf 'SKILLSHELF_TEST_CLI_ARCHIVE=%s\n' "$SKILLSHELF_CI_TMP/packages/$artifact" >> "$GITHUB_ENV"

      - name: Run Node tests including native install and crash recovery
        run: npm test

      - name: Run local POSIX terminal smoke tests
        if: runner.os != 'Windows'
        run: |
          python3 tests/terminal-smoke.py \
            --cli packages/cli/dist/index.js \
            --catalog "$SKILLSHELF_TEST_CATALOG" \
            --tmp "$SKILLSHELF_TEST_TMP"

      # Hosted runners discard these temporary artifacts after the job.
      # No provider keys, registry login, publication, release, or deployment steps.
