name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skillshelf-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Produce the single reviewed release bundle / Linux Node.js 22
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out standalone source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create private package output
        id: temp
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { appendFileSync, mkdtempSync, realpathSync } from "node:fs";
            import { tmpdir } from "node:os";
            import { join } from "node:path";
            const work = realpathSync.native(mkdtempSync(join(process.env.RUNNER_TEMP || tmpdir(), "skillshelf-ci-")));
            appendFileSync(process.env.GITHUB_ENV, `SKILLSHELF_CI_TMP=${work}\nSKILLSHELF_TEST_CATALOG=${join(work, "packages", "catalog.development.json")}\nNPM_CONFIG_CACHE=${join(work, "npm-cache")}\n`);
            appendFileSync(process.env.GITHUB_OUTPUT, `work=${work}\n`);
          '

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org

      - name: Build CLI and validate committed source metadata
        run: |
          set -euo pipefail
          npm run build
          npm run validate

      - name: Pack and verify complete skill and catalog archives
        run: |
          set -euo pipefail
          node scripts/pack-skills.mjs --output "$SKILLSHELF_CI_TMP/packages" --write-bootstrap
          node scripts/copy-catalog.mjs
          npm run validate
          node scripts/validate-catalog.mjs --catalog "$SKILLSHELF_TEST_CATALOG" --development

      - name: Pack the actual CLI and verify all 18 release archives
        run: |
          set -euo pipefail
          npm pack --workspace packages/cli --ignore-scripts --pack-destination "$SKILLSHELF_CI_TMP/packages"
          artifact="$(node --input-type=module -e 'import {readFileSync} from "node:fs"; const p=JSON.parse(readFileSync("packages/cli/package.json","utf8")); process.stdout.write(p.name.replace(/^@/,"").replace("/","-")+"-"+p.version+".tgz");')"
          node scripts/audit-cli-package.mjs "$SKILLSHELF_CI_TMP/packages/$artifact"
          node scripts/prepare-release.mjs --output "$SKILLSHELF_CI_TMP/packages" --cli-tarball "$SKILLSHELF_CI_TMP/packages/$artifact"

      - name: Share this exact bundle with every platform job
        uses: actions/upload-artifact@v4
        with:
          name: skillshelf-reviewed-bundle
          path: ${{ steps.temp.outputs.work }}/packages/
          if-no-files-found: error
          retention-days: 7

  test:
    name: ${{ matrix.os }} / Node.js ${{ matrix.node }}
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out standalone source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Set up Python for local runtime tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create private temporary test directories
        id: temp
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { appendFileSync, mkdirSync, mkdtempSync, realpathSync } from "node:fs";
            import { tmpdir } from "node:os";
            import { join } from "node:path";
            const work = realpathSync.native(mkdtempSync(join(process.env.RUNNER_TEMP || tmpdir(), "skillshelf-ci-")));
            const tests = join(work, "tests");
            mkdirSync(tests, { mode: 0o700 });
            const python = join(process.env.pythonLocation, process.platform === "win32" ? "python.exe" : "bin/python3");
            const values = {
              SKILLSHELF_CI_TMP: work,
              SKILLSHELF_TEST_TMP: tests,
              SKILLSHELF_TEST_CATALOG: join(work, "packages", "catalog.development.json"),
              SKILLSHELF_PYTHON: python,
              NPM_CONFIG_CACHE: join(work, "npm-cache")
            };
            appendFileSync(process.env.GITHUB_ENV, Object.entries(values).map(([key, value]) => `${key}=${value}`).join("\n") + "\n");
            appendFileSync(process.env.GITHUB_OUTPUT, `work=${work}\n`);
          '

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org

      - name: Build CLI and validate source metadata
        run: |
          set -euo pipefail
          npm run build
          npm run validate

      - name: Download the same reviewed archives on this platform
        uses: actions/download-artifact@v4
        with:
          name: skillshelf-reviewed-bundle
          path: ${{ steps.temp.outputs.work }}/packages

      - name: Recheck downloaded archives against source and publication plan
        run: |
          set -euo pipefail
          artifact="$(node --input-type=module -e 'import {readFileSync} from "node:fs"; const p=JSON.parse(readFileSync("packages/cli/package.json","utf8")); process.stdout.write(p.name.replace(/^@/,"").replace("/","-")+"-"+p.version+".tgz");')"
          node scripts/validate-catalog.mjs --catalog "$SKILLSHELF_TEST_CATALOG" --development
          node scripts/audit-cli-package.mjs "$SKILLSHELF_CI_TMP/packages/$artifact"
          node scripts/prepare-release.mjs --output "$SKILLSHELF_CI_TMP/packages" --cli-tarball "$SKILLSHELF_CI_TMP/packages/$artifact"
          printf 'SKILLSHELF_TEST_CLI_ARCHIVE=%s\n' "$SKILLSHELF_CI_TMP/packages/$artifact" >> "$GITHUB_ENV"

      # TEMPORARY diagnostic run: this step intentionally fails after the probes.
      # Remove it after finding the ACL cause so Windows runs the complete tests below.
      - name: Diagnose Windows PowerShell startup and ACL inspection
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: |
          node --input-type=module <<'NODE'
          import { spawn } from 'node:child_process';
          import path from 'node:path';
          import { WINDOWS_ACL_INSPECTION_SCRIPT } from './packages/cli/dist/runtime/privacy.js';

          const root = process.env.SystemRoot ?? process.env.SYSTEMROOT;
          const target = process.env.SKILLSHELF_TEST_TMP;
          const temporary = process.env.SKILLSHELF_CI_TMP;
          if (!root || !/^[A-Za-z]:\\Windows$/iu.test(root) || !target || !path.win32.isAbsolute(target) || !temporary || !path.win32.isAbsolute(temporary)) {
            console.log(JSON.stringify({ probe: 'preconditions', valid: false }));
            process.exit(1);
          }
          const system32 = path.win32.join(root, 'System32');
          const powershell = path.win32.join(system32, 'WindowsPowerShell', 'v1.0', 'powershell.exe');
          const sparse = { SystemRoot: root, SYSTEMROOT: root, PATH: system32, SKILLSHELF_ACL_PATH: target };
          const controlled = {
            ...sparse,
            WINDIR: root,
            ComSpec: path.win32.join(system32, 'cmd.exe'),
            PSModulePath: path.win32.join(system32, 'WindowsPowerShell', 'v1.0', 'Modules'),
            TEMP: temporary,
            TMP: temporary,
            USERPROFILE: temporary,
          };
          const full = { ...process.env, SKILLSHELF_ACL_PATH: target };
          const scripts = {
            static: "[Console]::WriteLine('1')",
            json: '@{ok=$true}|ConvertTo-Json -Compress',
            acl: WINDOWS_ACL_INSPECTION_SCRIPT,
          };
          const limitMs = 25_000;
          const inspect = (script, env) => new Promise(resolve => {
            let stdout = ''; let stdoutBytes = 0; let stderrBytes = 0;
            let timedOut = false; let outputLimit = false; let finished = false;
            const child = spawn(powershell, ['-NoLogo', '-NoProfile', '-NonInteractive', '-Command', script], {
              shell: false, windowsHide: true, env, stdio: ['ignore', 'pipe', 'pipe'],
            });
            const complete = result => {
              if (finished) return;
              finished = true;
              clearTimeout(timer);
              resolve(result);
            };
            const timer = setTimeout(() => { timedOut = true; child.kill(); }, limitMs);
            child.stdout.on('data', chunk => {
              stdoutBytes += chunk.length;
              if (stdoutBytes <= 65_536) stdout += chunk.toString('utf8');
              else { outputLimit = true; child.kill(); }
            });
            child.stderr.on('data', chunk => {
              stderrBytes += chunk.length;
              if (stderrBytes > 65_536) { outputLimit = true; child.kill(); }
            });
            child.once('error', () => complete({ status: 'spawn-error', stdoutBytes, stderrBytes }));
            child.once('close', code => {
              let jsonParseable = false;
              if (!outputLimit) { try { JSON.parse(stdout); jsonParseable = true; } catch {} }
              complete({ status: timedOut ? 'timeout' : outputLimit ? 'output-limit' : 'closed', code: code ?? -1, timedOut, stdoutBytes, stderrBytes, jsonParseable });
            });
          });
          for (const [environment, env] of [['sparse', sparse], ['controlled', controlled], ['full', full]]) {
            for (const [kind, script] of Object.entries(scripts)) {
              const started = Date.now();
              const result = await inspect(script, env);
              console.log(JSON.stringify({ probe: `${kind}-${environment}`, ...result, elapsedMs: Date.now() - started }));
            }
          }
          console.log(JSON.stringify({ probe: 'diagnostic-only-stop', status: 'intentional' }));
          process.exitCode = 1;
          NODE

      - name: Run Node tests including native install and crash recovery
        run: npm test

      - name: Run local POSIX terminal smoke tests
        if: runner.os != 'Windows'
        run: |
          python3 tests/terminal-smoke.py \
            --cli packages/cli/dist/index.js \
            --catalog "$SKILLSHELF_TEST_CATALOG" \
            --tmp "$SKILLSHELF_TEST_TMP"

      # Hosted runners discard these temporary artifacts after the job.
      # No provider keys, registry login, publication, release, or deployment steps.
